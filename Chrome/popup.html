<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Block People & Keywords</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell" aria-labelledby="popupTitle">
      <header class="popup-header">
        <img src="icons/icon-48.png" alt="" class="logo" />
        <div class="title-group">
          <h1 id="popupTitle">Block People & Keywords</h1>
          <p id="termCount" class="subtitle">0 blocked</p>
        </div>
        <label class="power-toggle" for="enabledToggle">
          <span class="sr-only">Enable filtering</span>
          <input id="enabledToggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </header>
      <section class="quick-add" aria-labelledby="addTitle">
        <h2 id="addTitle">Add block</h2>
        <div class="input-row">
          <label class="sr-only" for="termInput">Name, phrase, or keyword</label>
          <input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="Name, phrase, or keyword" />
          <button id="addBtn" class="icon-btn primary" type="button" aria-label="Add block">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
      </section>
      <section class="mode-section" aria-labelledby="modeTitle">
        <h2 id="modeTitle">Mode</h2>
        <fieldset class="mode-options">
          <legend class="sr-only">Filtering mode</legend>
          <label class="mode-row" for="modeHide">
            <input id="modeHide" type="radio" name="mode" value="hide" />
            <span><span class="mode-label">Hide matching content</span><span class="mode-desc">Remove the nearest post, comment, result, video, or image.</span></span>
          </label>
          <label class="mode-row" for="modeRedact">
            <input id="modeRedact" type="radio" name="mode" value="redact" />
            <span><span class="mode-label">Redact only the word</span><span class="mode-desc">Keep the page layout and cover matched words inline.</span></span>
          </label>
        </fieldset>
      </section>
      <section class="list-section" aria-labelledby="blockedTitle">
        <div class="section-heading">
          <h2 id="blockedTitle">Blocked terms</h2>
          <button id="clearBtn" class="text-btn danger" type="button">Clear</button>
        </div>
        <div class="list-frame">
          <ul id="termList" class="term-list" aria-label="Blocked terms"></ul>
          <div id="emptyState" class="empty-state" hidden>
            <p>No blocked terms</p>
            <button id="emptyAddBtn" class="text-btn" type="button">Add first block</button>
          </div>
        </div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="errorStatus" class="status error" role="alert" aria-live="assertive"></p>
      <footer class="popup-footer">
        <button id="optionsBtn" class="text-btn" type="button">Options</button>
        <nav class="footer-links" aria-label="Extension links">
          <a
            href="https://github.com/victorhumenhuk/Block-People"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Block People & Keywords on GitHub"
            title="GitHub"
          >GitHub</a>
          <a
            href="https://x.com/victorhumenhuk"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Victor Humenhuk on X"
            title="X"
          >X</a>
          <a
            href="https://victorhumenhuk.github.io/Block-People/privacy-policy.html"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open privacy policy"
            title="Privacy"
          >Privacy</a>
        </nav>
      </footer>
    </main>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
